[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-study-lab"
version = "0.1.0"
description = "A focused, friendly learning interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "groq>=1.0,<2.0",
  "pypdf>=5.9,<7.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
